baseURL = "https://jjh11737.github.io/"

title = "jjh"
copyright = "© jjh"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 20

[services.rss]
  limit = 50

[services.googleAnalytics]
  id = "G-RLD8VJ5L5Z"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.NotesJSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

[params]
  author = "jjh"
  description = ""
  DateFormat = "2006-01-02"
  defaultTheme = "auto"

  ShowReadingTime = false
  ShowWordCount = false
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true

  mainSections = ["post", "ub"]

  homeRecentCount = 8

  [params.comments]
    enable = false

  [params.fuseOpts]
    iscasesensitive = false
    threshold = 0.4
    ignorelocation = true
    keys = ["title"]

  [params.profileMode]
    enabled = true
    title = "jjh"
    subtitle = ""
    imageUrl = "https://avatars.githubusercontent.com/u/250367270"
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "post"
      url = "/post/"
    [[params.profileMode.buttons]]
      name = "note"
      url = "/note/"
    [[params.profileMode.buttons]]
      name = "UB"
      url = "/ub/"
    [[params.profileMode.buttons]]
      name = "关于"
      url = "/about/"

[[params.socialIcons]]
  name = "neteasecloudmusic"
  url = "https://music.163.com/#/user/home?id=9240724042"
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/jjh11737"
[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

[[menu.main]]
  name = "post"
  url = "/post/"
  weight = 10
[[menu.main]]
  name = "note"
  url = "/note/"
  weight = 15
[[menu.main]]
  name = "UB"
  url = "/ub/"
  weight = 20
[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 50
[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 60
[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 70
[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 80
