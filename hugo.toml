# ============================================================
#  个人主页 / 博客 —— Hugo + PaperMod
#  日常只需要动这几个地方：baseURL / profileMode / socialIcons / menu
baseURL = "https://jjh11737.github.io/"

title = "jjh's blog"
copyright = "© nocopyrightlol"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true

[pagination]
  pagerSize = 20

[services.rss]
  limit = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[outputFormats.NotesJSON]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.goldmark.renderer]
    unsafe = true     # allow the usage of html
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$']]
      inline = [['$', '$']]

# ------------------------------------------------------------
#  站点参数
# ------------------------------------------------------------
[params]
  author = "jjh"
  description = "no_description"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"

  ShowReadingTime = true
  ShowWordCount = false
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true # RSS 输出全文（<content:encoded>）

  mainSections = ["posts", "notes", "reading", "music"]

  homeRecentCount = 8

  [params.comments]
    enable = false

  # 搜索：本地 Fuse.js
  [params.fuseOpts]
    iscasesensitive = false
    threshold = 0.4
    ignorelocation = true
    keys = ["title", "permalink", "summary", "content"]

  # 首页 hero。把头像丢到 static/avatar.png 再把 imageUrl 填成 "/avatar.png"
  [params.profileMode]
    enabled = true
    title = "jjh"
    subtitle = ""
    imageUrl = ""
    imageWidth = 120
    imageHeight = 120

    [[params.profileMode.buttons]]
      name = "文章"
      url = "/posts/"
    [[params.profileMode.buttons]]
      name = "短记"
      url = "/notes/"
    [[params.profileMode.buttons]]
      name = "标签"
      url = "/tags/"
    [[params.profileMode.buttons]]
      name = "关于"
      url = "/about/"

# 图标名可用：github rss spotify lastfm neteasecloudmusic douban goodreads
# bilibili telegram mastodon steam zhihu 等（完整列表见主题 layouts/_partials/svg.html）
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/jjh11737"
[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

# ------------------------------------------------------------
