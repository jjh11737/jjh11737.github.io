<li class="note-item" data-note="{{ with .Params.noteTags }}{{ delimit . " " }}{{ end }}">
  <a class="note-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  <time class="note-item-date">{{ .Date.Format "2006-01-02" }}</time>
  {{- with .Params.noteTags }}
  <span class="note-item-tags">{{ range . }}#{{ . }} {{ end }}</span>
  {{- end }}
</li>
